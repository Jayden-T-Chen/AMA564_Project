# Gate design. The headline ablation in `ablation` below toggles the two
# `use` switches and splits the consistency gate into its two roles; `ladder`
# then moves the same objective along step size, lambda and batch size so the
# displacement column can say whether any of that movement buys something a
# larger step does not.

# Quantile entropy gate: keep the lowest-entropy fraction q of each batch.
# A quantile (not an absolute threshold) is used because predictive entropy
# shifts wholesale with corruption severity.
entropyGate:
  use: false             # filtering the batch by entropy measured worse than keeping
  keepFraction: 1.0      # the whole batch at every fraction tried, so the switch is
                         # off in the headline method. Those readings are the
                         # entropyGateOnly_* and entropyGate_* rows of
                         # results/ablation.csv.

# Consistency term: two label-preserving views per image, symmetric KL as the
# disagreement score. It enters the objective scaled by lambda, and the same
# normalised score reweights the samples (weight = 1 - d, floored so a sample is
# down-weighted but never dropped by this gate alone). Reweighting on its own
# measured nothing, so the loss term carries the gain; keeping both roles is
# what the proposal's objective says and it costs no extra pass.
# The second view is what methods/gatedTent.makeView builds: one per-image random
# crop back to 32x32 plus a horizontal flip, geometric only, because colour or
# blur transforms would resemble the corruptions under test.
#
# Both gates read the current batch: the entropy cutoff is a quantile of this
# batch's entropies, and the weight role divides disagreement by this batch's
# min-max span, so a sample's weight depends on the batch it lands in. On one
# fixed 256-sample score vector, batches of 16 move a weight by up to 0.206
# against the 256 reading and batches of 64 by up to 0.022, over the range
# [0.2, 1.0]; tests/testGateWeights.py prints both, `run.runAll test
# testGateWeights.py` reruns it. The loss term lambda * d_i uses the raw
# per-sample symmetric KL and carries no batch normalisation. Every `ladder` row
# has weights all ones (TENT rows switch the consistency gate off, loss rows
# switch inWeights off), so the displacement axis never crosses this span.
consistencyGate:
  use: true
  weight: 16.0           # lambda, selected on the validation cells; the `ablation` block
                         # below carries the whole sweep it was read off. Accuracy rises
                         # from +0.19 pp at 1 through +0.91 at 8 to +1.26 at 16, holds at
                         # +1.23 for 32 and falls to +0.16 at 64, so the frozen weight is
                         # an interior optimum with both of its neighbours measured. This
                         # is the value the main table and the online stream run at.
  weightFloor: 0.2
  inLoss: true           # lambda * d_i enters the objective
  inWeights: true        # 1 - normalised d_i reweights the samples
  cropScale: [0.8, 1.0]

loss:
  # L = sum_i w_i * (H(p_i) + lambda * d_i) / sum_i w_i
  normaliseByWeights: true

ablation:
  # The controlled comparison the Guidance asks for, plus the two split-role
  # controls that separate "reweighting the samples" from "adding a consistency
  # term to the objective". Checkpoint, seed, batch size, learning rate and the
  # cell list are identical across rows; `tent` is reached by switching both
  # gates off.
  # The entropy gate appears twice at each fraction, once with the consistency
  # term off and once with it on, so the two roles are separable and the sweep is
  # still readable at the frozen lambda.
  # Both `use` switches are pinned on every row: with entropyGate.use defaulting
  # to false, a row that only sets keepFraction runs as plain TENT and the
  # negative result it is meant to record disappears without a trace.
  cells: validation
  seeds: [7, 8, 9]
  variants:
    - name: tent
      overrides:
        entropyGate.use: false
        consistencyGate.use: false
    - name: entropyGateOnly_q75
      overrides:
        consistencyGate.use: false
        entropyGate.use: true
        entropyGate.keepFraction: 0.75
    - name: entropyGateOnly_q50
      overrides:
        consistencyGate.use: false
        entropyGate.use: true
        entropyGate.keepFraction: 0.5
    # The same two fractions with the consistency term left on, which is what the
    # headline method would look like if the entropy gate were switched on. They inherit
    # the file's lambda, so they sit on the same objective the headline rows run; their
    # q = 1.0 point is `bothGates_lambda16` below, and the three rows together are a
    # quantile sweep at the frozen lambda, so no separate tuning table is needed.
    - name: entropyGate_q75
      overrides:
        entropyGate.use: true
        entropyGate.keepFraction: 0.75
    - name: entropyGate_q50
      overrides:
        entropyGate.use: true
        entropyGate.keepFraction: 0.5
    - name: consistencyWeightOnly
      overrides:
        entropyGate.use: false
        consistencyGate.inLoss: false
        consistencyGate.weight: 1.0
    - name: consistencyLossOnly
      overrides:
        entropyGate.use: false
        consistencyGate.inWeights: false
        consistencyGate.weight: 1.0
    - name: bothGates
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 1.0
    - name: bothGates_lambda2
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 2.0
    - name: bothGates_lambda4
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 4.0
    # The points above 4, added in two rounds. The first three-seed run measured 1 / 2 /
    # 4 / 8 / 16 rising monotonically to 79.16%, which left the frozen weight inside a
    # climbing curve, so 32 and 64 are here to find where it turns over -- the same
    # reason the TENT ladder in `ladder` runs to 0.128. It does turn over: 32 reads
    # +1.23 pp against 16's +1.26, and 64 falls to +0.16 with a path length 2.8x longer
    # than 16's. The loss-only half of `ladder` peaks at the same weight, +1.25 pp at 16
    # against +0.63 at 32, so both readings of this term agree on 16 and the value that
    # defines the method is now bracketed on either side.
    - name: bothGates_lambda8
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 8.0
    - name: bothGates_lambda16
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 16.0
    - name: bothGates_lambda32
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 32.0
    - name: bothGates_lambda64
      overrides:
        entropyGate.use: true
        consistencyGate.weight: 64.0

# One ladder, three axes: the step size plain TENT takes, the weight the
# consistency term carries, and the batch size both run at. It replaces four
# blocks that each held part of the same sweep and repeated the rows the others
# had already measured, so the TENT ladder no longer has to be joined across two
# CSVs and nothing downstream has to deduplicate.
#
# Names read tent<batch>_lr<step size as a multiple of the 0.001 default> and
# loss<batch>_lambda<weight>. Every loss row switches inWeights off, which is
# what ablation identified as the only role carrying a gain, so this ladder moves
# one thing at a time.
#
# The comparison this block exists for is read off two columns, not one: the
# accuracy, and the displacementNorm each row records for itself. Two rows at the
# same batch size that travel the same distance and land at different accuracies
# are where a mechanism other than movement would show up. The delta the summary
# prints is against that batch size's own `lr1` row, because batch 16 holds four
# times the update steps of batch 64 and a delta across the two would measure the
# batch and the variant at once.
#
# `loss64_lambda1` repeats ablation's `consistencyLossOnly`. The overlap is kept
# on purpose: this block is the input to the displacement figure, and reading that
# figure off one CSV is worth two repeated rows.
#
# Seed budget: the batch-64 half carries the claim that decides the report's
# conclusion, so it runs at all three seeds and the matched-displacement gap gets
# a seed-to-seed spread. The batch 16 and 32 rows stay at one seed and are read as
# the shape of those regimes, not as a number to two decimals.
ladder:
  cells: validation
  reference: tent64_lr1
  seeds: [7, 8, 9]
  variants:
    # --- batch 64, plain TENT along its step size ---
    # The ladder runs until it turns over. Under the episodic protocol the seven
    # points up to 0.032 rose monotonically, which left adaptation.tunedLr an
    # interior point of a climbing curve rather than a selected optimum, so 0.064
    # and 0.128 are here to bracket the peak the step size actually has.
    - name: tent64_lrHalf
      lr: 0.0005
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr1
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr2
      lr: 0.002
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr4
      lr: 0.004
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr8
      lr: 0.008
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr16
      lr: 0.016
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr32
      lr: 0.032
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr64
      lr: 0.064
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent64_lr128
      lr: 0.128
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    # --- batch 64, the consistency term along lambda ---
    - name: loss64_lambda1
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 1.0}
    - name: loss64_lambda4
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 4.0}
    - name: loss64_lambda4_lrHalf
      lr: 0.0005
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 4.0}
    - name: loss64_lambda8
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 8.0}
    - name: loss64_lambda16
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 16.0}
    - name: loss64_lambda32
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 32.0}
    # --- batch 32, one pair ---
    - name: tent32_lr1
      batch: 32
      seeds: [7]
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: loss32_lambda4
      batch: 32
      seeds: [7]
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 4.0}
    # --- batch 16, where the gain reverses ---
    # A cell holds four times as many update steps at batch 16 as at batch 64, so
    # the batch-64 optimum cannot carry over and this regime needs its own TENT
    # ladder. Under the episodic protocol that ladder rose monotonically to 0.016
    # and never reached batch 64, so the reading here is the shape of the regime.
    - name: tent16_lrHalf
      batch: 16
      seeds: [7]
      lr: 0.0005
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent16_lr1
      batch: 16
      seeds: [7]
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent16_lr2
      batch: 16
      seeds: [7]
      lr: 0.002
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent16_lr4
      batch: 16
      seeds: [7]
      lr: 0.004
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent16_lr8
      batch: 16
      seeds: [7]
      lr: 0.008
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: tent16_lr16
      batch: 16
      seeds: [7]
      lr: 0.016
      overrides: {entropyGate.use: false, consistencyGate.use: false}
    - name: loss16_lambda1
      batch: 16
      seeds: [7]
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 1.0}
    - name: loss16_lambda4
      batch: 16
      seeds: [7]
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 4.0}
    # The same lambda at a quarter of the step size: if the loss of confidence at
    # batch 16 is the movement rather than the consistency signal, this row lands
    # back on TENT's batch-16 ladder.
    - name: loss16_lambda4_lrQuarter
      batch: 16
      seeds: [7]
      lr: 0.00025
      overrides: {entropyGate.use: false, consistencyGate.inWeights: false,
                  consistencyGate.weight: 4.0}
